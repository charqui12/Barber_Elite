  <script>
    function ajustarPaddingTop() {
      const fixedNav = document.querySelector('.navbar.fixed-top');
      if (fixedNav) {
        document.body.style.paddingTop = fixedNav.offsetHeight + 'px';
      } else {
        document.body.style.paddingTop = '';
      }
    }
    window.addEventListener('load', ajustarPaddingTop);
    window.addEventListener('resize', ajustarPaddingTop);
  </script>
