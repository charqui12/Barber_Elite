<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-galeria">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="#">
                <h2 class="d-flex align-items-center gap-2">
                   <i class="fa-solid fa-image"></i>
                    Galería
                </h2>
            </a>
        </div>
    </nav>

    <!-- Carrusel -->
   <div id="carouselExample" class="carousel slide">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="img/esta1.webp" class="d-block w-100" alt="...">
        </div>
        <div class="carousel-item">
            <img src="img/esta2.webp" class="d-block w-100" alt="...">
        </div>
        <div class="carousel-item">
            <img src="img/esta3.webp" class="d-block w-100" alt="...">
        </div>
        <div class="carousel-item">
            <img src="img/esta4.webp" class="d-block w-100" alt="...">
        </div>
    </div>

    <!-- Controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<section class="sobre-nosotros py-5 text-center" style="background-color: var(--light-color);">
    <h2>Sobre Elite Barber</h2>
    <p>En Elite Barber nos especializamos en cortes modernos y clásicos. Creamos un ambiente cómodo y profesional para
         cada cliente. ¡Ven y descubre tu nuevo estilo!</p>
</section>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
