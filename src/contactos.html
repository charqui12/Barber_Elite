<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section id="contacto" class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-5">
          <h2 class="text-center mb-4 fw-bold text-dark">💈 Contáctanos</h2>
          <p class="text-center text-muted mb-4">
            ¿Tienes dudas o quieres agendar una cita? Escríbenos y te responderemos pronto.
          </p>

          <form action="procesar_contacto.php" method="POST">
            <div class="form-floating mb-3">
              <input type="text" class="form-control rounded-3" id="nombre" name="nombre" placeholder="Tu nombre" required>
              <label for="nombre">Nombre completo</label>
            </div>
            <div class="form-floating mb-3">
              <input type="email" class="form-control rounded-3" id="correo" name="correo" placeholder="nombre@correo.com" required>
              <label for="correo">Correo electrónico</label>
            </div>
            <div class="form-floating mb-4">
              <textarea class="form-control rounded-3" id="mensaje" name="mensaje" style="height: 120px" placeholder="Escribe tu mensaje aquí" required></textarea>
              <label for="mensaje">Mensaje</label>
            </div>
            <button type="submit" class="btn btn-dark btn-lg w-100 rounded-3 shadow-sm">
              ✉️ Enviar mensaje
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>



    
</body>
</html>
